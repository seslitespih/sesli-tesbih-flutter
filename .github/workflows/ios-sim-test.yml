# ═══════════════════════════════════════════════════════════════════════
#  iOS simulator pace test (NOT a release workflow)
#  Plays synthetic Turkish "Sübhanallah" at several speeds into the iOS
#  Simulator microphone and records what the counter showed.
#  Trigger: push to the ios-sim-test branch only. Never touches main.
# ═══════════════════════════════════════════════════════════════════════
name: iOS simulator pace test

on:
  push:
    branches: [ios-sim-test]
    paths-ignore:
      - 'ci/android/**'
      - 'ci/baseline/**'
      - 'ci_results/**'
      - '.github/workflows/android-pace-test.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUNDLE_ID: com.sesliTesbih.app
  APP_ORG:   com.sesliTesbih
  APP_PROJ:  sesli_tesbih

jobs:
  sim-test:
    name: Simulator pace test
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls /Applications | grep "^Xcode_26" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | head -10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: |
          flutter create --platforms ios --org "$APP_ORG" --project-name "$APP_PROJ" .

      - name: Patch Info.plist and bundle id
        run: |
          P=ios/Runner/Info.plist
          plb() { /usr/libexec/PlistBuddy -c "$1" "$P" 2>/dev/null || true; }
          plb "Add :NSMicrophoneUsageDescription string 'Microphone is required for voice dhikr counting.'"
          plb "Add :NSSpeechRecognitionUsageDescription string 'Speech recognition is used to count dhikr words.'"
          plb "Add :NSLocationWhenInUseUsageDescription string 'Location is used for Qibla.'"
          plb "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Location is used for Qibla.'"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Vocal Tasbeeh'" "$P" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Vocal Tasbeeh'" "$P"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Build simulator app (debug)
        run: flutter build ios --simulator --debug --dart-define=AUTO_OPEN_DHIKR=1 --dart-define=AUTO_RESET=true

      - name: Run pace test in the simulator
        run: bash ci/ios_sim_test.sh
        env:
          SCENARIOS: ${{ vars.SCENARIOS || 'normal fast veryfast slow eight noise fast33 veryfast33' }}
          REPEATS:   ${{ vars.REPEATS || '2' }}

      - name: Commit results back to the branch
        if: always()
        run: |
          mkdir -p ci_results/ios_${GITHUB_RUN_NUMBER}
          cp -r ci_out/*.txt ci_out/*.png ci_out/*.yaml ci_results/ios_${GITHUB_RUN_NUMBER}/ 2>/dev/null || true
          git config user.name  "pace-test-bot"
          git config user.email "pace-test-bot@users.noreply.github.com"
          git add -f ci_results
          git commit -m "ci: ios simulator pace results [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ios-sim-test || true
          git push origin HEAD:ios-sim-test || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-results
          path: ci_out/
          if-no-files-found: ignore
