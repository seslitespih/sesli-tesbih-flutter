name: sesli_tesbih
description: Vocal Tasbeeh - Vocal Islamic Dhikr Counter
publish_to: 'none'
version: 1.5.4+34

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  adhan_dart: ^2.0.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon.png"
  min_ios_version: "12.0"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

# in_app_review -> url_launcher: 6.3.2x androidx.browser 1.9 / core 1.17 ister (AGP 8.9.1+). Proje AGP 8.7.3.
dependency_overrides:
  url_launcher_android: 6.3.16
